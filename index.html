<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GRIDBOX Electrical Simulator</title>
    <link rel="stylesheet" href="styles.css?v=11">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <div class="brand-mark" aria-hidden="true">GB</div>
          <div>
            <h1>GRIDBOX</h1>
            <p>Electrical grid simulator</p>
          </div>
        </div>
        <div class="top-actions">
          <button class="ghost-button" id="demoButton" type="button" title="Load demo network" aria-label="Load demo network">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 5h16v5H4z"></path>
              <path d="M7 16h10"></path>
              <path d="M9 10v6"></path>
              <path d="M15 10v6"></path>
              <path d="M7 19h10"></path>
            </svg>
          </button>
          <button class="ghost-button" id="saveButton" type="button" title="Export grid" aria-label="Export grid">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 4h12l2 2v14H5z"></path>
              <path d="M8 4v6h8V4"></path>
              <path d="M8 16h8"></path>
            </svg>
          </button>
          <button class="ghost-button" id="loadSavedButton" type="button" title="Import grid" aria-label="Import grid">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 20h14"></path>
              <path d="M12 4v11"></path>
              <path d="M8 11l4 4 4-4"></path>
              <path d="M6 6h12"></path>
            </svg>
          </button>
          <input id="importFileInput" type="file" accept="application/json,.json" hidden>
          <button class="ghost-button" id="clearButton" type="button" title="Clear network" aria-label="Clear network">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7h16"></path>
              <path d="M9 7V4h6v3"></path>
              <path d="M7 7l1 13h8l1-13"></path>
              <path d="M10 11v6"></path>
              <path d="M14 11v6"></path>
            </svg>
          </button>
          <output class="time-chip frequency-chip" id="frequencyReadout" aria-label="Grid frequency" title="Frequency on islands with flywheels">No flywheel</output>
          <div class="time-chip" id="timeReadout">t = 0 s</div>
          <button class="primary-button" id="runButton" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 5v14l11-7z"></path>
            </svg>
            Run
          </button>
        </div>
      </header>

      <main class="workspace">
        <aside class="toolrail" aria-label="Grid tools">
          <button class="tool-button active" type="button" data-mode="select" title="Select and move" aria-label="Select and move">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 3l13 9-6 1 4 7-3 1-4-7-4 5z"></path>
            </svg>
          </button>
          <button class="tool-button" type="button" data-mode="source" data-picker-trigger="source" title="Choose a source" aria-label="Choose a source">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="8"></circle>
              <path d="M13 4L8 13h4l-1 7 5-10h-4z"></path>
            </svg>
          </button>
          <button class="tool-button" type="button" data-mode="joint" data-joint-type="joint" title="Add substation" aria-label="Add substation">
            <span class="tool-glyph substation-glyph" aria-hidden="true"></span>
          </button>
          <button class="tool-button" type="button" data-mode="joint" data-joint-type="pole" title="Add distribution pole" aria-label="Add distribution pole">
            <span class="tool-glyph pole-glyph" aria-hidden="true"></span>
          </button>
          <button class="tool-button" type="button" data-mode="joint" data-joint-type="tower" title="Add transmission tower" aria-label="Add transmission tower">
            <span class="tool-glyph tower-glyph" aria-hidden="true"></span>
          </button>
          <button class="tool-button" type="button" data-mode="load" data-picker-trigger="load" title="Choose a load" aria-label="Choose a load">
            <span class="tool-glyph load-glyph" aria-hidden="true"></span>
          </button>
          <button class="tool-button" type="button" data-mode="battery" title="Add battery node" aria-label="Add battery node">
            <span class="tool-glyph battery-glyph" aria-hidden="true"></span>
          </button>
          <button class="tool-button" type="button" data-mode="flywheel" data-picker-trigger="flywheel" title="Choose a flywheel" aria-label="Choose a flywheel">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="white"></circle><path d="M5 12h14M12 5v14"></path></svg>
          </button>
          <div class="tool-separator"></div>
          <button class="tool-button voltage-tool distribution-tool" type="button" data-mode="line-distribution" data-picker-trigger="distribution" title="Choose a 10 kV line" aria-label="Choose a 10 kV line">
            <span>10 kV</span>
          </button>
          <button class="tool-button voltage-tool transmission-tool" type="button" data-mode="line-transmission" data-picker-trigger="transmission" title="Choose a 100 kV line" aria-label="Choose a 100 kV line">
            <span>100 kV</span>
          </button>
          <div class="tool-separator"></div>
          <button class="tool-button" type="button" id="deleteButton" title="Delete selection" aria-label="Delete selection">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7h16"></path>
              <path d="M9 7V4h6v3"></path>
              <path d="M8 7l1 13h6l1-13"></path>
            </svg>
          </button>
        </aside>

        <div class="placement-popover source-picker" id="sourcePicker" data-picker-panel="source" hidden>
          <div class="picker-heading">Sources</div>
          <div class="source-picker-grid">
            <button class="picker-option" type="button" data-source-type="wind" title="Wind Source" aria-label="Wind Source"><span class="source-preview wind-preview"></span></button>
            <button class="picker-option" type="button" data-source-type="solar" title="Solar Source" aria-label="Solar Source"><span class="source-preview solar-preview"></span></button>
            <button class="picker-option" type="button" data-source-type="coal" title="Coal Source" aria-label="Coal Source"><span class="source-preview coal-preview"></span></button>
            <button class="picker-option" type="button" data-source-type="geothermal" title="Geothermal Source" aria-label="Geothermal Source"><span class="source-preview geothermal-preview"></span></button>
            <button class="picker-option" type="button" data-source-type="gas" title="Natural Gas Source" aria-label="Natural Gas Source"><span class="source-preview gas-preview"></span></button>
            <button class="picker-option" type="button" data-source-type="nuclear" title="Nuclear Source" aria-label="Nuclear Source"><span class="source-preview nuclear-preview"></span></button>
            <button class="picker-option hydro-option" type="button" data-source-type="hydro" title="Hydroelectric Source" aria-label="Hydroelectric Source"><span class="source-preview hydro-preview"></span></button>
          </div>
        </div>

        <div class="placement-popover" data-picker-panel="flywheel" hidden>
          <div class="picker-heading">Flywheels</div>
          <div class="line-picker-grid" id="flywheelChoices"></div>
        </div>

        <div class="placement-popover load-picker" id="loadPicker" data-picker-panel="load" hidden>
          <div class="picker-heading">Loads</div>
          <div class="load-picker-grid">
            <button class="picker-option" type="button" data-load-type="general" title="General Load" aria-label="General Load"><span class="load-preview general-load-preview"></span></button>
            <button class="picker-option" type="button" data-load-type="residential" title="Residential Load" aria-label="Residential Load"><span class="load-preview residential-load-preview"></span></button>
            <button class="picker-option" type="button" data-load-type="commercial" title="Commercial Load" aria-label="Commercial Load"><span class="load-preview commercial-load-preview"></span></button>
            <button class="picker-option" type="button" data-load-type="industrial" title="Industrial Load" aria-label="Industrial Load"><span class="load-preview industrial-load-preview"></span></button>
          </div>
        </div>

        <div class="placement-popover line-picker distribution-picker" id="distributionPicker" data-picker-panel="distribution" hidden>
          <div class="picker-heading">10 kV lines</div>
          <div class="line-picker-grid">
            <button class="picker-option" type="button" data-line-type="distribution" data-line-variant="thin-1" title="500 A" aria-label="500 A, one thin wire"><span class="wire-preview one thin"></span></button>
            <button class="picker-option" type="button" data-line-type="distribution" data-line-variant="thin-2" title="1000 A" aria-label="1000 A, two thin wires"><span class="wire-preview two thin"></span></button>
            <button class="picker-option" type="button" data-line-type="distribution" data-line-variant="thick-1" title="2000 A" aria-label="2000 A, one thick wire"><span class="wire-preview one thick"></span></button>
            <button class="picker-option" type="button" data-line-type="distribution" data-line-variant="thick-2" title="4000 A" aria-label="4000 A, two thick wires"><span class="wire-preview two thick"></span></button>
          </div>
        </div>

        <div class="placement-popover line-picker transmission-picker" id="transmissionPicker" data-picker-panel="transmission" hidden>
          <div class="picker-heading">100 kV lines</div>
          <div class="line-picker-grid">
            <button class="picker-option" type="button" data-line-type="transmission" data-line-variant="thin-1" title="500 A" aria-label="500 A, one thin wire"><span class="wire-preview one thin"></span></button>
            <button class="picker-option" type="button" data-line-type="transmission" data-line-variant="thin-2" title="1000 A" aria-label="1000 A, two thin wires"><span class="wire-preview two thin"></span></button>
            <button class="picker-option" type="button" data-line-type="transmission" data-line-variant="thick-1" title="2000 A" aria-label="2000 A, one thick wire"><span class="wire-preview one thick"></span></button>
            <button class="picker-option" type="button" data-line-type="transmission" data-line-variant="thick-2" title="4000 A" aria-label="4000 A, two thick wires"><span class="wire-preview two thick"></span></button>
          </div>
        </div>

        <section class="canvas-panel">
          <canvas id="gridCanvas" aria-label="Electrical grid canvas"></canvas>
          <canvas class="map-layer" id="rotorLayer" aria-hidden="true"></canvas>
          <canvas class="map-layer" id="alarmLayer" aria-hidden="true" hidden></canvas>
          <canvas class="map-layer" id="transmissionLayer" aria-hidden="true"></canvas>
          <div class="canvas-hud">
            <button id="zoomOutButton" type="button" aria-label="Zoom out" title="Zoom out">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"></path></svg>
            </button>
            <span id="zoomReadout">100%</span>
            <button id="zoomInButton" type="button" aria-label="Zoom in" title="Zoom in">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"></path><path d="M12 6v12"></path></svg>
            </button>
          </div>
          <div class="status-chip" id="canvasStatus">Ready</div>
        </section>

        <aside class="inspector" id="inspector">
          <div class="section-heading">
            <h2>Network</h2>
            <span id="solveBadge">Unsolved</span>
          </div>
          <section class="frequency-panel" aria-label="Frequency history">
            <div class="field-row"><h3>Frequency</h3><small>Last 60 s</small></div>
            <svg viewBox="0 0 280 94" role="img" aria-label="Island frequencies over the last 60 simulated seconds">
              <g class="frequency-guides"><path d="M33 10H275 M33 38H275 M33 66H275"/></g>
              <g class="frequency-labels"><text x="0" y="13">61 Hz</text><text x="0" y="41">60 Hz</text><text x="0" y="69">59 Hz</text><text x="33" y="86">-60 s</text><text x="275" y="86" text-anchor="end">Now</text></g>
              <g id="frequencyTraces"></g>
            </svg>
            <div id="frequencyLegend">No active flywheel</div>
          </section>
          <div id="properties"></div>
        </aside>
      </main>

      <footer class="statusbar">
        <div id="networkSummary">0 nodes, 0 lines, total inertia 0 kg·m²</div>
        <div id="warningSummary">No warnings</div>
      </footer>
    </div>

    <script src="world.js?v=1-2935ea24" defer></script>
    <script src="grid-engine.js?v=11" defer></script>
    <script src="demo-grid.js?v=1" defer></script>
    <script src="app.js?v=16" defer></script>
  </body>
</html>
